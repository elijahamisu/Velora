<div class="auth-container">
  <div class="auth-card glass-card">
    <h1 class="brand-logo">VELORA</h1>
    <p class="auth-subtitle">Create your premium investment account</p>
    
    <form id="registerForm" class="auth-form">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe" required>
      </div>

      <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="08012345678" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="input-group">
        <label>Referral Code (Optional)</label>
        <input type="text" id="referralCode" placeholder="Enter code">
      </div>

      <button type="submit" class="gold-button w-full" id="regBtn">Create Account</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="/login">Login here</a>
    </p>
  </div>
</div>
