<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | VELORA - Elite Investments</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #B8860B;
            --luxury-white: #FFFFFF;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--luxury-white);
            background-image: radial-gradient(circle at top left, rgba(212, 175, 55, 0.03), transparent),
                              radial-gradient(circle at bottom right, rgba(212, 175, 55, 0.03), transparent);
            min-height: 100vh;
        }
        .heading-font { font-family: 'Playfair Display', serif; }
        .gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
        }
        .gold-text {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.03);
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.05);
        }
        .loader {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal-animate { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="py-12 px-6 flex flex-col items-center">

    <!-- Logo -->
    <div class="mb-10 text-center">
        <div class="w-14 h-14 gold-gradient rounded-full flex items-center justify-center mx-auto mb-4 shadow-xl">
            <span class="text-white font-bold text-2xl">V</span>
        </div>
        <h1 class="text-3xl heading-font font-bold text-gray-900">Create Account</h1>
        <p class="text-gray-400 mt-1">Join the elite circle of VELORA investors.</p>
    </div>

    <!-- Registration Card -->
    <div class="glass-card w-full max-w-xl rounded-[40px] p-8 md:p-12 mb-10">
        <form id="registerForm" class="space-y-6">
            <!-- Status Alerts -->
            <div id="statusMsg" class="hidden p-4 rounded-2xl text-sm font-medium border"></div>

            <div class="grid md:grid-cols-2 gap-6">
                <!-- Full Name -->
                <div class="input-group">
                    <label class="block text-[10px] uppercase tracking-[0.15em] font-bold text-gray-400 mb-2 ml-1">Full Name</label>
                    <input type="text" id="fullName" required placeholder="John Doe"
                        class="w-full px-5 py-4 bg-gray-50/50 border border-gray-100 rounded-2xl transition-all">
                </div>
                <!-- Phone -->
                <div class="input-group">
                    <label class="block text-[10px] uppercase tracking-[0.15em] font-bold text-gray-400 mb-2 ml-1">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="08012345678"
                        class="w-full px-5 py-4 bg-gray-50/50 border border-gray-100 rounded-2xl transition-all">
                </div>
            </div>

            <!-- Email -->
            <div class="input-group">
                <label class="block text-[10px] uppercase tracking-[0.15em] font-bold text-gray-400 mb-2 ml-1">Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com"
                    class="w-full px-5 py-4 bg-gray-50/50 border border-gray-100 rounded-2xl transition-all">
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <!-- Password -->
                <div class="input-group relative">
                    <label class="block text-[10px] uppercase tracking-[0.15em] font-bold text-gray-400 mb-2 ml-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full px-5 py-4 bg-gray-50/50 border border-gray-100 rounded-2xl transition-all">
                    <button type="button" class="toggle-pass absolute right-4 bottom-4 text-gray-300"><i data-lucide="eye" class="w-5 h-5"></i></button>
                </div>
                <!-- Confirm Password -->
                <div class="input-group relative">
                    <label class="block text-[10px] uppercase tracking-[0.15em] font-bold text-gray-400 mb-2 ml-1">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••••"
                        class="w-full px-5 py-4 bg-gray-50/50 border border-gray-100 rounded-2xl transition-all">
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <!-- Referral Code -->
                <div class="input-group">
                    <label class="block text-[10px] uppercase tracking-[0.15em] font-bold text-gray-400 mb-2 ml-1">Referral Code (Optional)</label>
                    <input type="text" id="referralCode" placeholder="VEL-XXXX"
                        class="w-full px-5 py-4 bg-gray-50/50 border border-gray-100 rounded-2xl transition-all font-mono text-sm">
                </div>
                <!-- Gift Code -->
                <div class="input-group">
                    <label class="block text-[10px] uppercase tracking-[0.15em] font-bold text-gray-400 mb-2 ml-1">Gift Code (Optional)</label>
                    <input type="text" id="giftCode" placeholder="GIFT-XXXX"
                        class="w-full px-5 py-4 bg-gray-50/50 border border-gray-100 rounded-2xl transition-all font-mono text-sm">
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-5 gold-gradient text-white font-bold rounded-2xl shadow-xl hover:opacity-90 transition-all flex items-center justify-center gap-3">
                <span id="btnText">Create Premium Account</span>
                <div id="loader" class="loader hidden"></div>
            </button>

            <p class="text-center text-gray-500 text-sm pt-4">
                Already a member? <a href="login.html" class="text-[#D4AF37] font-bold hover:underline">Sign In</a>
            </p>
        </form>
    </div>

    <!-- Telegram Modal -->
    <div id="tgModal" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/60 backdrop-blur-md hidden">
        <div class="bg-white rounded-[40px] w-full max-w-sm p-10 text-center shadow-2xl modal-animate">
            <div class="w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="send" class="w-12 h-12 text-[#229ED9]"></i>
            </div>
            <h3 class="text-2xl heading-font font-bold mb-3">Welcome to VELORA</h3>
            <p class="text-gray-500 mb-8 leading-relaxed">Join our Telegram community for exclusive updates and real-time support.</p>
            <div class="space-y-4">
                <a id="tgLink" href="#" target="_blank" class="block w-full py-4 bg-[#229ED9] text-white font-bold rounded-2xl">Join Community</a>
                <button id="skipTg" class="block w-full py-4 text-gray-400 font-semibold">Proceed to Dashboard</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        lucide.createIcons();

        const supabase = createClient(
            import.meta.env.VITE_SUPABASE_URL,
            import.meta.env.VITE_SUPABASE_ANON_KEY
        );

        const form = document.getElementById('registerForm');
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');
        const tgModal = document.getElementById('tgModal');

        // 1. Referral Auto-fill
        const urlParams = new URLSearchParams(window.location.search);
        const refCode = urlParams.get('ref');
        if (refCode) document.getElementById('referralCode').value = refCode;

        // 2. Toggle Passwords
        document.querySelectorAll('.toggle-pass').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = btn.previousElementSibling;
                input.type = input.type === 'password' ? 'text' : 'password';
                btn.innerHTML = `<i data-lucide="${input.type === 'password' ? 'eye' : 'eye-off'}" class="w-5 h-5"></i>`;
                lucide.createIcons();
            });
        });

        // 3. Register Logic
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);
            statusMsg.className = 'hidden p-4 rounded-2xl text-sm font-medium border';

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const referralCode = document.getElementById('referralCode').value;
            const giftCode = document.getElementById('giftCode').value;

            // Basic Validation
            if (password !== confirmPassword) {
                showMsg('Passwords do not match', 'error');
                setLoading(false);
                return;
            }

            if (password.length < 6) {
                showMsg('Password must be at least 6 characters', 'error');
                setLoading(false);
                return;
            }

            try {
                // Step A: Auth Sign Up
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email,
                    password,
                    options: { data: { full_name: fullName, phone: phone } }
                });

                if (authError) throw authError;
                const userId = authData.user.id;

                // Step B: Initialize Tables (Profile, Wallet, Referral)
                // Note: In a production environment, use a database trigger/function for atomicity.
                // Here we perform sequential inserts as per project requirements.

                // Create Profile
                await supabase.from('profiles').insert([{ id: userId, full_name: fullName, phone, referral_code_used: referralCode }]);

                // Create Wallet & ₦600 Welcome Bonus
                const { error: walletErr } = await supabase.from('wallets').insert([{ 
                    user_id: userId, 
                    balance: 600.00 
                }]);
                if (walletErr) throw walletErr;

                // Log Bonus Transaction
                await supabase.from('transactions').insert([{
                    user_id: userId,
                    amount: 600.00,
                    type: 'welcome_bonus',
                    status: 'completed',
                    description: 'Initial luxury welcome credit'
                }]);

                // Create Notifications
                await supabase.from('notifications').insert([{
                    user_id: userId,
                    title: 'Welcome to VELORA',
                    message: 'Your ₦600 luxury bonus has been credited to your wallet.'
                }]);

                // Step C: Handle Gift Code (if provided)
                if (giftCode) {
                    const { data: giftData, error: giftSearchErr } = await supabase
                        .from('gift_codes')
                        .select('*')
                        .eq('code', giftCode)
                        .eq('is_used', false)
                        .single();

                    if (giftData && !giftSearchErr) {
                        // Apply Gift
                        await supabase.from('wallets').rpc('increment_balance', { row_id: userId, amt: giftData.amount });
                        await supabase.from('gift_codes').update({ is_used: true, used_by: userId }).eq('id', giftData.id);
                        await supabase.from('transactions').insert([{
                            user_id: userId,
                            amount: giftData.amount,
                            type: 'gift_code',
                            status: 'completed',
                            description: `Redeemed gift code: ${giftCode}`
                        }]);
                    }
                }

                // Success!
                showMsg('Account created! Welcome bonus credited.', 'success');
                setTimeout(() => {
                    document.getElementById('tgLink').href = import.meta.env.VITE_TELEGRAM_LINK;
                    tgModal.classList.remove('hidden');
                }, 1000);

            } catch (err) {
                showMsg(err.message, 'error');
                setLoading(false);
            }
        });

        document.getElementById('skipTg').onclick = () => window.location.href = 'dashboard.html';

        function setLoading(state) {
            submitBtn.disabled = state;
            loader.classList.toggle('hidden', !state);
            btnText.textContent = state ? 'Crafting your account...' : 'Create Premium Account';
        }

        function showMsg(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.classList.remove('hidden');
            if (type === 'error') {
                statusMsg.classList.add('bg-red-50', 'text-red-600', 'border-red-100');
            } else {
                statusMsg.classList.add('bg-green-50', 'text-green-600', 'border-green-100');
            }
        }
    </script>
</body>
</html>
