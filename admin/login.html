<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access | VELORA Private Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #B8860B;
            --luxury-white: #FBFAFA;
            --admin-black: #0A0A0A;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--luxury-white);
            background-image: radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 100% 100%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .heading-font { font-family: 'Playfair Display', serif; }
        .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); }
        .gold-text {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }
        .admin-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
            outline: none;
        }
        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Security Shake Animation */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="w-full max-w-md">
        <!-- Brand Header -->
        <div class="text-center mb-10">
            <div class="w-16 h-16 gold-gradient rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-2xl rotate-3 hover:rotate-0 transition-transform duration-500">
                <span class="text-white font-bold text-3xl">V</span>
            </div>
            <h1 class="text-3xl font-bold heading-font tracking-tight text-gray-900">VELORA <span class="gold-text">ADMIN</span></h1>
            <p class="text-gray-400 text-xs uppercase tracking-[0.2em] mt-2 font-semibold">Secure Management Gateway</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-[40px] p-8 md:p-10">
            <form id="adminLoginForm" class="space-y-6">
                
                <!-- Status Feedback -->
                <div id="statusMsg" class="hidden p-4 rounded-2xl text-xs font-bold uppercase tracking-wider border text-center"></div>

                <div class="space-y-4">
                    <div class="relative">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1 mb-2 block">Authorized Email</label>
                        <div class="relative">
                            <i data-lucide="shield-check" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-300"></i>
                            <input type="email" id="email" required placeholder="admin@velora.com"
                                class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-100 rounded-2xl admin-input transition-all text-sm">
                        </div>
                    </div>

                    <div class="relative">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1 mb-2 block">Security Access Key</label>
                        <div class="relative">
                            <i data-lucide="key" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-300"></i>
                            <input type="password" id="password" required placeholder="••••••••"
                                class="w-full pl-12 pr-12 py-4 bg-gray-50 border border-gray-100 rounded-2xl admin-input transition-all text-sm">
                            <button type="button" id="togglePass" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gold transition">
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between px-1">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-gold focus:ring-gold">
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest group-hover:text-gray-600 transition">Persistent Session</span>
                    </label>
                </div>

                <button type="submit" id="loginBtn" 
                    class="w-full py-5 gold-gradient text-white font-bold rounded-2xl shadow-xl shadow-gold/20 flex items-center justify-center gap-3 active:scale-95 transition-all">
                    <span id="btnText">Verify Identity</span>
                    <div id="loader" class="loader hidden"></div>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center mt-8 text-[10px] font-bold text-gray-300 uppercase tracking-[0.3em]">
            &copy; 2024 Velora Systems &bull; Encrypted
        </p>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        lucide.createIcons();

        const supabase = createClient(
            import.meta.env.VITE_SUPABASE_URL,
            import.meta.env.VITE_SUPABASE_ANON_KEY
        );

        const form = document.getElementById('adminLoginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');
        const statusMsg = document.getElementById('statusMsg');

        // Toggle Password
        document.getElementById('togglePass').onclick = function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        };

        // Login Logic
        form.onsubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            hideMsg();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                // 1. Authenticate
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;

                // 2. Role Check (Verify user is Admin)
                // We check the profiles table for the 'role' column
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();

                if (profileError || !profile || !['admin', 'super_admin', 'moderator'].includes(profile.role)) {
                    // Security Breach Attempt: User is not an admin
                    await supabase.auth.signOut();
                    throw new Error("Access Denied: Unauthorized Personnel");
                }

                // 3. Success
                showMsg(`Identity Verified. Accessing Terminal...`, 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (err) {
                showMsg(err.message, 'error');
                form.classList.add('shake');
                setTimeout(() => form.classList.remove('shake'), 500);
                setLoading(false);
            }
        };

        function setLoading(state) {
            loginBtn.disabled = state;
            loader.classList.toggle('hidden', !state);
            btnText.textContent = state ? 'Decrypting...' : 'Verify Identity';
        }

        function showMsg(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.classList.remove('hidden');
            if (type === 'error') {
                statusMsg.className = 'p-4 rounded-2xl text-xs font-bold uppercase tracking-wider border text-center bg-red-50 text-red-600 border-red-100';
            } else {
                statusMsg.className = 'p-4 rounded-2xl text-xs font-bold uppercase tracking-wider border text-center bg-green-50 text-green-600 border-green-100';
            }
        }

        function hideMsg() {
            statusMsg.classList.add('hidden');
        }

        // Auto-redirect if already logged in as Admin
        async function checkExistingSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
                if (profile && ['admin', 'super_admin', 'moderator'].includes(profile.role)) {
                    window.location.href = 'dashboard.html';
                }
            }
        }
        checkExistingSession();
    </script>
</body>
</html>
