<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | VELORA — Private Wealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ink: #0C0E13;
            --ink-soft: #171A22;
            --paper: #F6F4EF;
            --paper-card: #FFFFFF;
            --gold: #B7935B;
            --gold-deep: #8F6E3E;
            --gold-light: #E7D9BC;
            --ink-text: #14161C;
            --muted: #7A7E88;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--paper);
            color: var(--ink-text);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .heading-font { font-family: 'Fraunces', serif; font-feature-settings: "ss01"; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
        .gold-gradient { background: linear-gradient(135deg, #C9A468 0%, #8F6E3E 100%); }
        .gold-text {
            background: linear-gradient(135deg, #C9A468 0%, #8F6E3E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: var(--paper-card);
            border: 1px solid rgba(20, 22, 28, 0.06);
            box-shadow: 0 1px 2px rgba(12,14,19,0.03), 0 12px 24px -18px rgba(12,14,19,0.18);
        }
        #islandNav {
            background: rgba(12, 14, 19, 0.97);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(183, 147, 91, 0.22);
            box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(183,147,91,0.05) inset;
        }
        .island-item {
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 2px; padding: 7px 4px; border-radius: 13px;
            color: rgba(246, 244, 239, 0.4);
            transition: color 0.2s ease, background 0.2s ease;
        }
        .island-item i { width: 16px; height: 16px; }
        .island-item span { font-size: 8px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
        .island-item.active {
            color: var(--gold-light);
            background: linear-gradient(135deg, rgba(183,147,91,0.22) 0%, rgba(143,110,62,0.10) 100%);
        }
        .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
    </style>
</head>
<body class="bg-[var(--paper)]">

    <!-- Auth Guard Loader -->
    <div id="authGuard" class="fixed inset-0 z-[100] flex items-center justify-center" style="background: var(--ink);">
        <div class="text-center">
            <div class="w-14 h-14 border-2 rounded-full animate-spin mx-auto mb-5" style="border-color: rgba(183,147,91,0.25); border-top-color: var(--gold);"></div>
            <p class="heading-font gold-text text-2xl tracking-wide">VELORA</p>
        </div>
    </div>

    <!-- Header -->
    <header class="fixed top-0 right-0 left-0 h-20 bg-[var(--paper)]/85 backdrop-blur-md border-b border-black/[0.06] z-40">
        <div class="h-full flex items-center justify-between px-6 max-w-3xl mx-auto">
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="w-9 h-9 flex items-center justify-center rounded-full border border-black/[0.08] text-[var(--ink-text)] hover:border-[var(--gold)]/40 transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                </a>
                <h2 class="text-lg font-semibold heading-font tracking-tight">Notifications</h2>
            </div>
            <button id="markAllBtn" class="text-[10px] font-bold uppercase tracking-widest text-[var(--gold-deep)] hover:text-[var(--gold)] transition">Mark all read</button>
        </div>
    </header>

    <!-- Mobile Island Nav -->
    <nav id="islandNav" class="lg:hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-50 rounded-[22px] flex items-center gap-1 px-2 py-1.5 w-[92%] max-w-sm">
        <a href="dashboard.html" class="island-item flex-1"><i data-lucide="layout-dashboard"></i><span>Home</span></a>
        <a href="invest.html" class="island-item flex-1"><i data-lucide="gem"></i><span>Plans</span></a>
        <a href="wallet.html" class="island-item flex-1"><i data-lucide="wallet"></i><span>Wallet</span></a>
        <a href="referral.html" class="island-item flex-1"><i data-lucide="users"></i><span>Referrals</span></a>
        <a href="profile.html" class="island-item flex-1"><i data-lucide="user"></i><span>Profile</span></a>
    </nav>

    <!-- Main -->
    <main class="pt-28 px-6 pb-24">
        <div class="max-w-3xl mx-auto">
            <div class="card rounded-[28px] overflow-hidden">
                <div id="notifList" class="divide-y divide-black/[0.05]">
                    <div class="p-12 text-center text-[var(--muted)] text-sm italic">Loading notifications...</div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        lucide.createIcons();

        const supabase = createClient(
            import.meta.env.VITE_SUPABASE_URL,
            import.meta.env.VITE_SUPABASE_ANON_KEY
        );

        let user = null;

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            user = session.user;
            document.getElementById('authGuard').classList.add('hidden');
            loadNotifications();
        }

        // NOTE: assumes the `notifications` table has at least
        // id, user_id, is_read, created_at, plus a message/title-style
        // text field. Column names for the message text vary by schema —
        // this reads whichever of `message`, `title`, or `body` exists,
        // falling back to a generic label so nothing crashes if the exact
        // name differs from what's assumed here.
        async function loadNotifications() {
            const { data, error } = await supabase
                .from('notifications')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false });

            const list = document.getElementById('notifList');

            if (error) {
                console.error('Notifications fetch error:', error);
                list.innerHTML = `<div class="p-12 text-center text-red-400 text-xs font-bold uppercase tracking-widest">Could not load notifications — check console</div>`;
                return;
            }

            const notifs = data || [];
            if (notifs.length === 0) {
                list.innerHTML = `<div class="p-12 text-center text-[var(--muted)] text-sm">No notifications yet.</div>`;
                return;
            }

            list.innerHTML = notifs.map(nItem => {
                const text = nItem.message || nItem.title || nItem.body || 'Notification';
                const date = nItem.created_at ? new Date(nItem.created_at).toLocaleString() : '';
                const unread = nItem.is_read === false;
                return `
                    <div class="p-6 flex items-start gap-4 ${unread ? 'bg-[var(--gold-light)]/10' : ''} notif-row" data-id="${nItem.id}">
                        ${unread ? '<span class="unread-dot mt-1.5"></span>' : '<span class="w-2"></span>'}
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold text-[var(--ink-text)]">${text}</p>
                            <p class="text-[10px] text-[var(--muted)] font-medium mono mt-1">${date}</p>
                        </div>
                    </div>
                `;
            }).join('');

            // Tapping an unread notification marks it read
            document.querySelectorAll('.notif-row').forEach(row => {
                row.addEventListener('click', () => markRead(row.dataset.id));
            });
        }

        async function markRead(id) {
            const { error } = await supabase.from('notifications').update({ is_read: true }).eq('id', id);
            if (error) console.error('Mark read error:', error);
            loadNotifications();
        }

        document.getElementById('markAllBtn').onclick = async () => {
            const { error } = await supabase.from('notifications').update({ is_read: true }).eq('user_id', user.id).eq('is_read', false);
            if (error) console.error('Mark all read error:', error);
            loadNotifications();
        };

        init();
    </script>
</body>
</html>
