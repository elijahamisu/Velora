<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Notifications · Altivex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ink: #0C0E13;
            --ink-soft: #171A22;
            --paper: #F6F4EF;
            --paper-card: #FFFFFF;
            --gold: #C6F432;
            --gold-deep: #C6F432;
            --gold-light: #C6F432;
            --ink-text: #14161C;
            --muted: #7A7E88;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--paper);
            color: var(--ink-text);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
    </style>
    <link rel="stylesheet" href="/altivex.css">
</head>
<body class="bg-[var(--paper)]">

    <!-- Auth Guard Loader -->
    <div id="authGuard" class="fixed inset-0 z-[100] flex items-center justify-center" style="background: var(--ink);">
        <div class="text-center">
            <div class="w-14 h-14 border-2 rounded-full animate-spin mx-auto mb-5" style="border-color: rgba(198, 244, 50,0.25); border-top-color: var(--gold);"></div>
            <span class="ax-logo ax-logo-lg"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M0 0h13l7 7v13H0z" fill="#C6F432"/><path d="M5.5 14.5 12.5 7.5M8 7.5h4.5V12" stroke="#000" stroke-width="2" fill="none" stroke-linecap="square"/></svg><span>altivex</span></span>
        </div>
    </div>

    <!-- ============ Altivex shell: notifications ============ -->
    <header class="ax-topbar">
        <div class="ax-topbar-inner" style="max-width: 820px;">
            <div class="flex items-center gap-3 min-w-0">
                <a href="dashboard.html" class="ax-icon-btn" aria-label="Back to dashboard"><i data-lucide="arrow-left"></i></a>
                <a href="dashboard.html" class="hidden sm:inline-flex" aria-label="Altivex home"><span class="ax-logo ax-logo-sm"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M0 0h13l7 7v13H0z" fill="#C6F432"/><path d="M5.5 14.5 12.5 7.5M8 7.5h4.5V12" stroke="#000" stroke-width="2" fill="none" stroke-linecap="square"/></svg><span>altivex</span></span></a>
                <span class="ax-crumb">Notifications</span>
            </div>
            <button id="markAllBtn" class="ax-btn ax-btn-sm">Mark all read</button>
        </div>
    </header>

    <!-- ============ Mobile tab bar ============ -->
    <nav id="islandNav" class="ax-tabbar" aria-label="Tabs">
        <a href="dashboard.html" data-page="dashboard" class="island-item"><i data-lucide="layout-grid"></i><span>Home</span></a>
        <a href="invest.html" data-page="invest" class="island-item"><i data-lucide="trending-up"></i><span>Invest</span></a>
        <a href="wallet.html" data-page="wallet" class="island-item"><i data-lucide="wallet"></i><span>Wallet</span></a>
        <a href="referral.html" data-page="referral" class="island-item"><i data-lucide="users"></i><span>Referral</span></a>
        <a href="profile.html" data-page="profile" class="island-item"><i data-lucide="user-round"></i><span>Profile</span></a>
    </nav>

    <!-- Main -->
    <main class="ax-main ax-main-narrow">
        <div class="max-w-3xl mx-auto">
            <div class="ax-card rounded-[14px] overflow-hidden">
                <div id="notifList" class="divide-y divide-black/[0.05]">
                    <div class="p-12 text-center text-[var(--muted)] text-sm ">Loading notifications...</div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        lucide.createIcons();

        const supabase = createClient(
            import.meta.env.VITE_SUPABASE_URL,
            import.meta.env.VITE_SUPABASE_ANON_KEY
        );

        let user = null;

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            user = session.user;
            document.getElementById('authGuard').classList.add('hidden');
            loadNotifications();
        }

        // NOTE: assumes the `notifications` table has at least
        // id, user_id, is_read, created_at, plus a message/title-style
        // text field. Column names for the message text vary by schema —
        // this reads whichever of `message`, `title`, or `body` exists,
        // falling back to a generic label so nothing crashes if the exact
        // name differs from what's assumed here.
        async function loadNotifications() {
            const { data, error } = await supabase
                .from('notifications')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false });

            const list = document.getElementById('notifList');

            if (error) {
                console.error('Notifications fetch error:', error);
                list.innerHTML = `<div class="p-12 text-center text-red-400 text-xs font-bold uppercase tracking-widest">Could not load notifications — check console</div>`;
                return;
            }

            const notifs = data || [];
            if (notifs.length === 0) {
                list.innerHTML = `<div class="p-12 text-center text-[var(--muted)] text-sm">No notifications yet.</div>`;
                return;
            }

            list.innerHTML = notifs.map(nItem => {
                const text = nItem.message || nItem.title || nItem.body || 'Notification';
                const date = nItem.created_at ? new Date(nItem.created_at).toLocaleString() : '';
                const unread = nItem.is_read === false;
                return `
                    <div class="p-6 flex items-start gap-4 ${unread ? 'bg-[var(--gold-light)]/10' : ''} notif-row" data-id="${nItem.id}">
                        ${unread ? '<span class="unread-dot mt-1.5"></span>' : '<span class="w-2"></span>'}
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold text-[var(--ink-text)]">${text}</p>
                            <p class="text-[10px] text-[var(--muted)] font-medium mono mt-1">${date}</p>
                        </div>
                    </div>
                `;
            }).join('');

            // Tapping an unread notification marks it read
            document.querySelectorAll('.notif-row').forEach(row => {
                row.addEventListener('click', () => markRead(row.dataset.id));
            });
        }

        async function markRead(id) {
            const { error } = await supabase.from('notifications').update({ is_read: true }).eq('id', id);
            if (error) console.error('Mark read error:', error);
            loadNotifications();
        }

        document.getElementById('markAllBtn').onclick = async () => {
            const { error } = await supabase.from('notifications').update({ is_read: true }).eq('user_id', user.id).eq('is_read', false);
            if (error) console.error('Mark all read error:', error);
            loadNotifications();
        };

        init();
    </script>
</body>
</html>
