<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InBox | VELORA — Notifications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #B8860B;
            --luxury-white: #FBFAFA;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--luxury-white);
            color: #1a1a1a;
            -webkit-tap-highlight-color: transparent;
        }
        .heading-font { font-family: 'Playfair Display', serif; }
        .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); }
        .gold-text {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }

        /* Nav Styles (Consistent) */
        .sidebar-item:hover, .sidebar-active {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.08) 0%, transparent 100%);
            color: var(--gold);
            border-left: 3px solid var(--gold);
        }
        .island-nav {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 420px; background: rgba(15, 15, 15, 0.88);
            backdrop-filter: blur(24px); border-radius: 40px; padding: 10px 24px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4); z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .island-item { color: rgba(255,255,255,0.5); transition: 0.3s; }
        .island-item.active { color: var(--gold); }
        
        #sidebar { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        #sidebarOverlay { backdrop-filter: blur(6px); transition: 0.3s; }

        /* Notification Specific Styles */
        .notif-item { transition: all 0.2s ease; cursor: pointer; }
        .notif-item:active { transform: scale(0.98); background: rgba(212, 175, 55, 0.05); }
        .unread-dot { width: 8px; height: 8px; background: var(--gold); border-radius: 50%; }
        
        /* Category Badges */
        .badge-investment { background: #E0F2FE; color: #0369A1; }
        .badge-deposit { background: #DCFCE7; color: #15803D; }
        .badge-withdrawal { background: #FEF2F2; color: #B91C1C; }
        .badge-earnings { background: #FDF2F7; color: #BE185D; }
        .badge-system { background: #F3F4F6; color: #374151; }
    </style>
</head>
<body class="bg-[#F8F9FA]">

    <!-- Auth Guard Loader -->
    <div id="authGuard" class="fixed inset-0 z-[200] bg-white flex items-center justify-center">
        <div class="text-center">
            <div class="w-12 h-12 border-4 border-gray-100 border-t-[#D4AF37] rounded-full animate-spin mx-auto mb-4"></div>
            <p class="heading-font gold-text text-lg tracking-widest uppercase">Velora</p>
        </div>
    </div>

    <!-- Navigation Components -->
    <div id="sidebarOverlay" class="fixed inset-0 z-[140] bg-black/40 hidden opacity-0"></div>
    <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-white border-r border-gray-100 z-[150] lg:translate-x-0 -translate-x-full">
        <div class="p-8 h-full flex flex-col">
            <div class="flex items-center justify-between mb-10">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 gold-gradient rounded-full flex items-center justify-center text-white font-bold">V</div>
                    <span class="text-2xl font-bold heading-font gold-text">VELORA</span>
                </div>
                <button id="closeSidebar" class="lg:hidden text-gray-400"><i data-lucide="x"></i></button>
            </div>
            <nav class="space-y-1 flex-1">
                <a href="dashboard.html" class="sidebar-item flex items-center gap-4 px-6 py-4 rounded-2xl transition text-sm font-semibold text-gray-500"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
                <a href="invest.html" class="sidebar-item flex items-center gap-4 px-6 py-4 rounded-2xl transition text-sm font-semibold text-gray-500"><i data-lucide="gem" class="w-5 h-5"></i> Invest</a>
                <a href="deposit.html" class="sidebar-item flex items-center gap-4 px-6 py-4 rounded-2xl transition text-sm font-semibold text-gray-500"><i data-lucide="arrow-down-circle" class="w-5 h-5"></i> Deposit</a>
                <a href="withdraw.html" class="sidebar-item flex items-center gap-4 px-6 py-4 rounded-2xl transition text-sm font-semibold text-gray-500"><i data-lucide="arrow-up-circle" class="w-5 h-5"></i> Withdraw</a>
                <a href="wallet.html" class="sidebar-item flex items-center gap-4 px-6 py-4 rounded-2xl transition text-sm font-semibold text-gray-500"><i data-lucide="wallet" class="w-5 h-5"></i> Wallet</a>
                <a href="notifications.html" class="sidebar-item sidebar-active flex items-center gap-4 px-6 py-4 rounded-2xl transition text-sm font-semibold"><i data-lucide="bell" class="w-5 h-5"></i> Notifications</a>
                <div class="pt-8 mt-8 border-t border-gray-50">
                    <a href="profile.html" class="sidebar-item flex items-center gap-4 px-6 py-4 rounded-2xl transition text-sm font-semibold text-gray-500"><i data-lucide="user" class="w-5 h-5"></i> Profile</a>
                    <button id="logoutBtn" class="w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition text-sm font-semibold text-red-400 hover:bg-red-50"><i data-lucide="log-out" class="w-5 h-5"></i> Logout</button>
                </div>
            </nav>
        </div>
    </aside>

    <header class="fixed top-0 right-0 left-0 h-20 bg-white/80 backdrop-blur-md border-b border-gray-50 z-40 lg:left-72 hidden lg:block">
        <div class="h-full flex items-center justify-between px-10">
            <h2 class="text-xl font-bold heading-font">Global <span class="gold-text">Inbox</span></h2>
            <div class="flex items-center gap-4">
                <button onclick="markAllAsRead()" class="text-[10px] font-bold uppercase tracking-widest text-gold hover:underline">Mark All As Read</button>
                <div class="w-[1px] h-4 bg-gray-200"></div>
                <div id="topWallet" class="flex items-center gap-2 bg-gray-50 px-4 py-2 rounded-full border border-gray-100">
                    <i data-lucide="wallet" class="w-3 h-3 text-gold"></i>
                    <span id="topBalance" class="text-[10px] font-bold">₦0.00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile Floating Island Nav -->
    <div class="island-nav lg:hidden">
        <a href="dashboard.html" class="island-item"><i data-lucide="layout-dashboard"></i></a>
        <a href="invest.html" class="island-item"><i data-lucide="gem"></i></a>
        <a href="wallet.html" class="island-item"><i data-lucide="wallet"></i></a>
        <a href="notifications.html" class="island-item active"><i data-lucide="bell"></i></a>
        <button id="mobileMenuBtn" class="island-item"><i data-lucide="menu"></i></button>
    </div>

    <!-- Main Content -->
    <main class="lg:ml-72 pt-6 lg:pt-28 px-6 pb-36 min-h-screen">
        <div class="max-w-4xl mx-auto">
            
            <!-- Mobile Header Section -->
            <div class="lg:hidden flex justify-between items-end mb-8 mt-2">
                <div>
                    <h2 class="text-3xl font-bold heading-font">Inbox</h2>
                    <p class="text-xs text-gray-400 font-medium">Updates and activity alerts.</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="fetchNotifications()" class="p-3 bg-white border border-gray-100 rounded-2xl text-gold shadow-sm"><i data-lucide="refresh-cw" class="w-5 h-5"></i></button>
                    <button onclick="deleteAllNotifications()" class="p-3 bg-white border border-gray-100 rounded-2xl text-red-400 shadow-sm"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="flex gap-2 mb-8 no-scrollbar overflow-x-auto pb-2">
                <button onclick="filterNotifs('all')" id="filter-all" class="px-6 py-2.5 rounded-full text-xs font-bold whitespace-nowrap bg-gold text-white shadow-lg shadow-gold/20 transition">All Notifications</button>
                <button onclick="filterNotifs('unread')" id="filter-unread" class="px-6 py-2.5 rounded-full text-xs font-bold whitespace-nowrap bg-white border border-gray-100 text-gray-400 transition">Unread</button>
                <button onclick="markAllAsRead()" class="px-6 py-2.5 rounded-full text-xs font-bold whitespace-nowrap bg-white border border-gray-100 text-gold transition lg:hidden">Mark All Read</button>
            </div>

            <!-- Notifications List -->
            <div id="notifList" class="space-y-4">
                <!-- Skeleton Loader -->
                <div class="animate-pulse space-y-4">
                    <div class="h-24 bg-white rounded-[32px] border border-gray-50"></div>
                    <div class="h-24 bg-white rounded-[32px] border border-gray-50"></div>
                    <div class="h-24 bg-white rounded-[32px] border border-gray-50"></div>
                </div>
            </div>

        </div>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        lucide.createIcons();

        const supabase = createClient(
            import.meta.env.VITE_SUPABASE_URL,
            import.meta.env.VITE_SUPABASE_ANON_KEY
        );

        let user = null;
        let allNotifications = [];
        let currentFilter = 'all';

        // --- 1. Init & Auth ---
        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            user = session.user;
            document.getElementById('authGuard').classList.add('hidden');
            
            fetchNotifications();
            loadWallet();
            setupRealtime();
        }

        // --- 2. Data Fetching ---
        async function fetchNotifications() {
            try {
                const { data, error } = await supabase
                    .from('notifications')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allNotifications = data;
                renderNotifications();
            } catch (err) {
                console.error("Error fetching notifications:", err);
            }
        }

        async function loadWallet() {
            const { data } = await supabase.from('wallets').select('balance').eq('user_id', user.id).single();
            if (data) document.getElementById('topBalance').textContent = `₦${data.balance.toLocaleString()}`;
        }

        // --- 3. Rendering ---
        function renderNotifications() {
            const container = document.getElementById('notifList');
            let filtered = allNotifications;
            
            if (currentFilter === 'unread') {
                filtered = allNotifications.filter(n => !n.is_read);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="py-20 text-center">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="bell-off" class="text-gray-300 w-8 h-8"></i>
                        </div>
                        <p class="heading-font text-gray-400 font-bold">Inbox is empty</p>
                        <p class="text-[10px] text-gray-300 uppercase tracking-widest mt-1">Check back later for updates</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(n => {
                const date = new Date(n.created_at);
                const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = date.toLocaleDateString();
                const categoryClass = `badge-${n.category?.toLowerCase() || 'system'}`;

                return `
                    <div class="notif-item relative group bg-white border border-gray-100 rounded-[32px] p-6 shadow-sm ${!n.is_read ? 'border-l-4 border-l-gold' : ''}">
                        <div class="flex items-start gap-4">
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 ${getIconBg(n.category)}">
                                <i data-lucide="${getIcon(n.category)}" class="w-6 h-6 ${getIconColor(n.category)}"></i>
                            </div>
                            <div class="flex-1 min-w-0" onclick="markAsRead('${n.id}')">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="px-3 py-1 rounded-full text-[8px] font-extrabold uppercase tracking-widest ${categoryClass}">${n.category || 'SYSTEM'}</span>
                                    <span class="text-[9px] text-gray-400 font-bold">${timeStr} • ${dateStr}</span>
                                </div>
                                <h4 class="text-sm font-bold text-gray-800 mb-1 flex items-center gap-2">
                                    ${n.title}
                                    ${!n.is_read ? '<div class="unread-dot"></div>' : ''}
                                </h4>
                                <p class="text-xs text-gray-500 leading-relaxed">${n.message}</p>
                            </div>
                            <div class="flex flex-col gap-2">
                                <button onclick="deleteNotification('${n.id}')" class="p-2 text-gray-200 hover:text-red-400 transition"><i data-lucide="x" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        // --- 4. Actions ---
        window.filterNotifs = (filter) => {
            currentFilter = filter;
            document.getElementById('filter-all').className = filter === 'all' ? 'px-6 py-2.5 rounded-full text-xs font-bold whitespace-nowrap bg-gold text-white shadow-lg shadow-gold/20 transition' : 'px-6 py-2.5 rounded-full text-xs font-bold whitespace-nowrap bg-white border border-gray-100 text-gray-400 transition';
            document.getElementById('filter-unread').className = filter === 'unread' ? 'px-6 py-2.5 rounded-full text-xs font-bold whitespace-nowrap bg-gold text-white shadow-lg shadow-gold/20 transition' : 'px-6 py-2.5 rounded-full text-xs font-bold whitespace-nowrap bg-white border border-gray-100 text-gray-400 transition';
            renderNotifications();
        };

        window.markAsRead = async (id) => {
            const target = allNotifications.find(n => n.id === id);
            if (!target || target.is_read) return;

            try {
                const { error } = await supabase
                    .from('notifications')
                    .update({ is_read: true })
                    .eq('id', id);
                
                if (error) throw error;
                target.is_read = true;
                renderNotifications();
            } catch (err) {
                console.error("Error marking read:", err);
            }
        };

        window.markAllAsRead = async () => {
            try {
                const { error } = await supabase
                    .from('notifications')
                    .update({ is_read: true })
                    .eq('user_id', user.id)
                    .eq('is_read', false);
                
                if (error) throw error;
                allNotifications.forEach(n => n.is_read = true);
                renderNotifications();
            } catch (err) {
                console.error("Error marking all read:", err);
            }
        };

        window.deleteNotification = async (id) => {
            try {
                const { error } = await supabase
                    .from('notifications')
                    .delete()
                    .eq('id', id);
                
                if (error) throw error;
                allNotifications = allNotifications.filter(n => n.id !== id);
                renderNotifications();
            } catch (err) {
                console.error("Error deleting notification:", err);
            }
        };

        window.deleteAllNotifications = async () => {
            if (!confirm("Clear your entire inbox?")) return;
            try {
                const { error } = await supabase
                    .from('notifications')
                    .delete()
                    .eq('user_id', user.id);
                
                if (error) throw error;
                allNotifications = [];
                renderNotifications();
            } catch (err) {
                console.error("Error deleting all:", err);
            }
        };

        // --- 5. Utilities ---
        function getIcon(cat) {
            const map = {
                investment: 'gem',
                deposit: 'arrow-down-circle',
                withdrawal: 'arrow-up-circle',
                earnings: 'zap',
                referral: 'users',
                gift: 'gift',
                welcome: 'award',
                announcement: 'megaphone'
            };
            return map[cat?.toLowerCase()] || 'bell';
        }

        function getIconBg(cat) {
            const map = {
                investment: 'bg-blue-50',
                deposit: 'bg-green-50',
                withdrawal: 'bg-red-50',
                earnings: 'bg-pink-50',
                referral: 'bg-purple-50',
                gift: 'bg-orange-50',
                welcome: 'bg-gold/10'
            };
            return map[cat?.toLowerCase()] || 'bg-gray-50';
        }

        function getIconColor(cat) {
            const map = {
                investment: 'text-blue-600',
                deposit: 'text-green-600',
                withdrawal: 'text-red-600',
                earnings: 'text-pink-600',
                referral: 'text-purple-600',
                gift: 'text-orange-600',
                welcome: 'text-gold'
            };
            return map[cat?.toLowerCase()] || 'text-gray-400';
        }

        function setupRealtime() {
            supabase.channel('notif-sync')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${user.id}` }, (payload) => {
                    allNotifications.unshift(payload.new);
                    renderNotifications();
                    // Audio feedback could be added here for premium feel
                })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'wallets', filter: `user_id=eq.${user.id}` }, () => {
                    loadWallet();
                })
                .subscribe();
        }

        // Sidebar Control
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        document.getElementById('mobileMenuBtn').onclick = () => { 
            sidebar.classList.remove('-translate-x-full'); 
            overlay.classList.remove('hidden'); 
            setTimeout(() => overlay.classList.add('opacity-100'), 10); 
        };
        document.getElementById('closeSidebar').onclick = overlay.onclick = () => { 
            sidebar.classList.add('-translate-x-full'); 
            overlay.classList.remove('opacity-100'); 
            setTimeout(() => overlay.classList.add('hidden'), 400); 
        };

        document.getElementById('logoutBtn').onclick = async () => { 
            await supabase.auth.signOut(); 
            window.location.href = 'login.html'; 
        };

        init();
    </script>
</body>
</html>
